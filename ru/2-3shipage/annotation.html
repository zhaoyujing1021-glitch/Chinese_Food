<body style="background: #FAF6F0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
<div class="annotation-box" style="max-width: 600px; margin: 40px auto; padding: 25px; border: 1px solid #E8DFD5; border-radius: 8px; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.06);">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #F0EAE1; padding-bottom: 12px; gap: 10px; flex-wrap: wrap;">
    <h2 id="annotation-title" style="margin: 0; color:#D9531E; font-size: 1.35rem;">Загрузка...</h2>
    
    <div class="lang-nav">
      <span class="lang-label">Язык: </span>
      <div class="lang-switch">
        <a href="../../ja/2-3shipage/annotation.html" class="">日本語</a>
        <a href="../../zh/2-3shipage/annotation.html" class="">中文</a>
        <a href="../../en/2-3shipage/annotation.html" class="">EN</a>
        <a href="#" class="active">RU</a>
      </div>
    </div>
  </div>
  <div id="annotation-content" style="line-height: 1.8; margin: 18px 0; color: #443322; font-size: 1.02rem;"></div>
  <button onclick="window.close();"
    style="background: #D9531E; border: none; color: white; padding: 8px 24px; border-radius: 4px; cursor: pointer; font-size: 0.95rem; font-weight: bold; transition: background 0.2s;">
    Закрыть
  </button>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const wordId = urlParams.get('id');
  const dict = {"饼":{"title":"Лепёшка (Нан / Бин)","content":"Традиционная пресная или дрожжевая лепёшка, выпекаемая в тандыре или на сковороде, основа уйгурской кухни."},"馕":{"title":"Уйгурский нан","content":"Круглая ароматная лепёшка с золотистой корочкой, выпекаемая на стенках глиняного тандыра."},"烤包子":{"title":"Самса (Кяобаоцзы)","content":"Хрустящие пирожки с сочной начинкой из рубленой баранины и лука, запечённые до золотистого цвета в тандыре."},"羊肉串":{"title":"Шашлык из баранины (Кавап)","content":"Кусочки свежей баранины, нанизанные на шпажки и обжаренные на углях с кумином, хлопьями чили и солью."},"东北":{"title":"Северо-восточная кухня (Дунбэй)","content":"Традиционная кухня провинций Хэйлунцзян, Цзилинь и Ляонин, славящаяся большими порциями и согревающими рагу."},"酸菜":{"title":"Квашеная капуста Суаньцай","content":"Ферментированная пекинская капуста, главный зимний продукт, незаменимый для наваристых супов и хого со свининой."},"锅包肉":{"title":"Гобаожоу (Хрустящая свинина)","content":"Тонкие ломтики свинины в хрустящем крахмальном кляре под кисло-сладким соусом, созданные в Харбине."},"东北乱炖":{"title":"Северо-восточное рагу Луаньдунь","content":"Сытное домашнее рагу из свиных рёбрышек, картофеля, баклажанов, фасоли, кукурузы и прозрачной лапши."},"地三鲜":{"title":"Дисаньсянь (Три земных дара)","content":"Ароматное блюдо из обжаренного картофеля, баклажанов и сладкого перца в густом соево-чесночном соусе."},"东北大拉皮":{"title":"Лапша Лапи (Дунбэй Да Ла Пи)","content":"Широкая прозрачная лапша из картофельного крахмала, подаваемая холодной со свежими огурцами и кунжутной заправкой."},"糖葫芦":{"title":"Танхулу (Боярышник в карамели)","content":"Ягоды китайского боярышника на бамбуковой шпажке, покрытые хрустящей леденцовой глазурью."},"拔丝":{"title":"Басы (Сладкие карамельные нити)","content":"Кусочки батата или яблок в кипящем карамельном сиропе, который вытягивается в тонкие блестящие нити."},"溥仪":{"title":"Пу И (Последний император)","content":"Двенадцатый и последний правитель династии Цин. Повара императорского двора обогатили кухню северо-востока."},"满州族":{"title":"Маньчжуры","content":"Коренной народ Северо-Восточного Китая, чьи обычаи тушения мяса и заготовки запасов на зиму сформировали кухню Дунбэя."},"满族":{"title":"Маньчжуры","content":"Коренной народ Северо-Восточного Китая, чьи обычаи тушения мяса и заготовки запасов на зиму сформировали кухню Дунбэя."},"香菜":{"title":"Кинза (Кориандр)","content":"Ароматная свежая зелень, широко используемая в салатах и горячих супах для придания яркого освежающего вкуса."},"13种面饼":{"title":"13 видов хлеба","content":"Описаны в словаре XI века «Диван лугат ат-турк», что свидетельствует о богатейшей истории хлебопечения на Шёлковом пути."},"中式烹饪技法":{"title":"Китайские кулинарные техники","content":"В уйгурском языке обжарка в воке называется «Сай» (от кит. «Цай»). Сильный огонь вока преобразил подачу лагмана."},"四川料理":{"title":"Сычуаньская кухня","content":"Одна из четырёх великих кулинарных школ Китая, знаменитая богатством вкусов, жгучим перцем чили и сычуаньским перцем."},"麻婆豆腐":{"title":"Мапо тофу","content":"Легендарное сычуаньское блюдо: нежный тофу, тушёный с говяжьим фаршем, маслом чили и покалывающим сычуаньским перцем."},"麻辣香锅":{"title":"Мала Сянго (Сухая острая сковорода)","content":"Морепродукты, мясо и овощи, быстро обжаренные в воке со жгучими специями и ароматным сычуаньским перцем."},"火锅":{"title":"Сычуаньский хого (Китайский самовар)","content":"Кипящий на столе пряный бульон на говяжьем жире со специями, в котором гости варят мясо и овощи."},"棒棒鸡":{"title":"Курица Баньбань","content":"Нежное куриное мясо под густым соусом из кунжутной пасты, сычуаньского перца и масла чили."},"凉糕":{"title":"Рисовое желе Лянгао","content":"Освежающий традиционный летний десерт из рисовой муки с текстурой нежного пудинга, политый густым тростниковым сиропом."},"冰糖银耳":{"title":"Суп из снежного гриба с сахаром","content":"Целебный десертный суп из белого древесного гриба, леденцового сахара и ягод годжи."},"串串香":{"title":"Чуаньчуаньсян (Шпажки в хого)","content":"Разнообразные ингредиенты на шпажках, которые варят в общем пряном котле с острым бульоном."},"钵钵鸡":{"title":"Бобоцзи (Холодные шпажки)","content":"Отварные шпажки, пропитанные холодным ароматным маслом чили или зелёным сычуаньским перцем."},"叶儿粑":{"title":"Еэрба (Клейкие рисовые пирожки)","content":"Пирожки из клейкой рисовой муки с мясной начинкой, приготовленные на пару в душистых листьях."},"狼牙土豆":{"title":"Картофель Вольфтус","content":"Рифлёные жареные ломтики картофеля, перемешанные с маслом чили, сычуаньским перцем и свежей зеленью."},"点心":{"title":"Димсам","content":"Изысканные миниатюрные закуски, подаваемые в бамбуковых пароварках во время кантонского чаепития ямча."},"流沙包":{"title":"Булочки Люшабао","content":"Пышные паровые булочки с вытекающей горячей начинкой из заварного крема и солёного утиного желтка."},"河粉":{"title":"Рисовая лапша Хэфэнь","content":"Широкая плоская рисовая лапша из пригорода Гуанчжоу, основа знаменитого жареного блюда с говядиной."},"镬气":{"title":"Дыхание вока (Вокхей)","content":"Неповторимый дымный карамелизованный аромат, возникающий при виртуозной жарке на раскалённом воке."}};

  if (wordId && dict[wordId]) {
    document.getElementById('annotation-title').textContent = dict[wordId].title;
    document.getElementById('annotation-content').innerHTML = dict[wordId].content;
  } else if (wordId) {
    document.getElementById('annotation-title').textContent = wordId;
    document.getElementById('annotation-content').textContent = "Пояснение для этого термина не найдено.";
  } else {
    document.getElementById('annotation-title').textContent = "Пояснение для этого термина не найдено.";
  }

  if (wordId) {
    document.querySelectorAll('.lang-switch a').forEach(a => {
      const href = a.getAttribute('href');
      if (href && href !== '#') {
        a.setAttribute('href', href + '?id=' + encodeURIComponent(wordId));
      }
    });
  }
</script>
</body>
</html>
