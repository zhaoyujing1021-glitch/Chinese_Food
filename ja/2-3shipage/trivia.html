    <h1>中華料理の豆知識</h1>
    <p>知っていると面白い、中華料理に関する雑学やマナーを掲載するページです。</p>
    <h2>餃子の位置づけ：おかずか、主食か？</h2>
    <p><strong>日本での位置づけ：おかず。</strong>日本では焼き餃子が主流で、白ご飯やスープなどと定食にして食べます。餃子（炭水化物）をおかずにしてご飯（炭水化物）を食べる「炭水化物コンビ」が定番です。</p>
    <p><strong>中国での位置づけ：主食。</strong>中国では水餃子が主流で、皮が厚く具沢山のため、それ自体がメインの主食として食べられます。中国の人から見ると「餃子をおかずにご飯を食べる」のは非常に驚かれます。</p>
