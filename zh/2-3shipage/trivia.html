    <h1>中华料理趣味冷知识</h1>
    <p>了解这些鲜为人知的餐桌文化与冷知识，能让品尝中华美食的过程更加妙趣横生。</p>
    <h2>水饺与煎饺：主食还是配菜？</h2>
    <p><strong>日本的视角：配菜佳肴。</strong>在日本，以薄皮日式煎饺最为流行，人们习惯点上一盘煎饺作为配菜，搭配白米饭和汤品一同食用。“碳水配碳水”是日式定食的经典搭档。</p>
    <p><strong>中国的视角：绝对主食。</strong>在中国（尤其是北方），水饺是节庆与团圆最重要的主食。饺子皮厚实有筋道，内馅荤素俱全，本身就是一顿完整的主餐。因此，中国人看到“饺子配米饭”往往会觉得非常新奇与不可思议。</p>
